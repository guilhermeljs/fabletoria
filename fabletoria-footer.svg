<svg width="1000" height="120" viewBox="0 0 1000 120" fill="none"
  xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_grad" x1="0" y1="0" x2="1000" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.5" stop-color="#070c1b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="rainbow_glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="20%" stop-color="#facc15"/>
      <stop offset="40%" stop-color="#11ab99"/>
      <stop offset="60%" stop-color="#51abd5"/>
      <stop offset="80%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1000" height="120" fill="url(#bg_grad)"/>

  <path d="M200 100 Q 500 112 800 100" stroke="url(#rainbow_glow)" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>

  <text x="500" y="30" fill="#edf0f3" text-anchor="middle" style="font: 600 14px 'Inter', sans-serif; letter-spacing: 3px; text-transform: uppercase;" filter="url(#glow)">Star to support Fabletoria</text>

  <text x="500" y="58" fill="#94a3b8" text-anchor="middle" style="font: 400 13px 'Inter', sans-serif; letter-spacing: 0.3px;">I was building a game. My team needed a narrative tool. Everything was expensive, complex, or built for solo work.</text>

  <text x="500" y="80" fill="#94a3b8" text-anchor="middle" style="font: 400 13px 'Inter', sans-serif; letter-spacing: 0.3px;">So I built Fabletoria. Free forever, made for teams, simple enough to just work.</text>
</svg>