<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_grad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.5" stop-color="#070c1b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="rainbow_glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="20%" stop-color="#facc15"/>
      <stop offset="40%" stop-color="#11ab99"/>
      <stop offset="60%" stop-color="#51abd5"/>
      <stop offset="80%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <filter id="glow_focal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="100" height="100" rx="20" fill="url(#bg_grad)"/>

  <text x="50" y="55" fill="url(#rainbow_glow)" text-anchor="middle" dominant-baseline="middle" style="font: italic 600 90px 'Georgia', serif; letter-spacing: 1px;" filter="url(#glow_focal)">
    F
  </text>
</svg>
