<svg width="1000" height="300" viewBox="0 0 1000 300" fill="none"
  xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_grad" x1="0" y1="0" x2="1000" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617" />
      <stop offset="0.5" stop-color="#070c1b" />
      <stop offset="1" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="rainbow_glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="20%" stop-color="#facc15" />
      <stop offset="40%" stop-color="#11ab99" />
      <stop offset="60%" stop-color="#51abd5" />
      <stop offset="80%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1000" height="300" fill="url(#bg_grad)" />

  <path d="M0 100H1000 M0 200H1000 M333 0V300 M666 0V300" stroke="#1e293b" stroke-width="0.5" opacity="0.5"/>

  <circle cx="100" cy="80" r="40" stroke="#51abd5" stroke-width="0.5" opacity="0.3" />
  <circle cx="120" cy="60" r="20" fill="#51abd5" opacity="0.1" />

  <rect x="850" y="200" width="60" height="60" rx="10" stroke="#c084fc" stroke-width="1" opacity="0.2" transform="rotate(15 880 230)" />

  <circle cx="200" cy="220" r="4" fill="#11ab99" opacity="0.6" />
  <circle cx="800" cy="70" r="3" fill="#facc15" opacity="0.6" />
  <circle cx="900" cy="150" r="5" fill="#f43f5e" opacity="0.4" />
  <circle cx="150" cy="250" r="3" fill="#0ea5e9" opacity="0.5" />
  <path d="M300 225 Q 500 245 700 225" stroke="url(#rainbow_glow)" stroke-width="2" stroke-linecap="round" opacity="0.6" filter="url(#glow)" />

  <g transform="translate(500, 150)">
    <text x="0" y="0" fill="#edf0f3" text-anchor="middle" dominant-baseline="middle" style="font: italic 600 72px 'Georgia', serif; letter-spacing: 2px;" filter="url(#glow)">
      Fabletoria
    </text>

    <text x="0" y="55" fill="#94a3b8" text-anchor="middle" style="font: 400 14px 'Inter', sans-serif; letter-spacing: 5px; text-transform: uppercase;">
      Your always-free narrative design tool.
    </text>
  </g>
</svg>
